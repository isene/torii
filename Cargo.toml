[package]
name = "fe2o3-torii"
version = "0.1.3"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Captive-portal listener for NetworkManager. Replaces Firefox's removed login-page banner. Member of the Fe2O3 suite."
license = "Unlicense"
repository = "https://github.com/isene/torii"
readme = "README.md"

[[bin]]
name = "torii"
path = "src/main.rs"

[dependencies]
zbus = { version = "5", features = ["blocking-api"] }
# 1.7 keeps an idle helper thread forever, waking it twice a second.
blocking = "=1.6.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
